<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="VHSFin">
  <!-- <rect width="100" height="100" fill="#1A100C"/> -->
  <!-- Cassette footprint ~1.81:1, centered -->
  <g transform="translate(6.5,26.2)">
    <defs>
      <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2C2C2E"/>
        <stop offset="55%" stop-color="#161618"/>
        <stop offset="100%" stop-color="#0E0E10"/>
      </linearGradient>
      <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3A3A3E"/>
        <stop offset="100%" stop-color="#1A1A1C"/>
      </linearGradient>
      <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#F4F0E8"/>
        <stop offset="100%" stop-color="#E6E0D4"/>
      </linearGradient>
      <radialGradient id="tape" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1A100C"/>
        <stop offset="70%" stop-color="#0A0806"/>
        <stop offset="100%" stop-color="#000000"/>
      </radialGradient>
    </defs>
    <rect width="87" height="47.8" rx="1.6" fill="url(#shell)" stroke="#050506" stroke-width="0.9"/>
    <!-- ribs -->
    <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="0.35">
      <line x1="2" y1="12" x2="85" y2="12"/>
      <line x1="2" y1="15.2" x2="85" y2="15.2"/>
      <line x1="2" y1="18.4" x2="85" y2="18.4"/>
      <line x1="2" y1="21.6" x2="85" y2="21.6"/>
      <line x1="2" y1="24.8" x2="85" y2="24.8"/>
      <line x1="2" y1="28" x2="85" y2="28"/>
      <line x1="2" y1="31.2" x2="85" y2="31.2"/>
      <line x1="2" y1="34.4" x2="85" y2="34.4"/>
      <line x1="2" y1="37.6" x2="85" y2="37.6"/>
      <line x1="2" y1="40.8" x2="85" y2="40.8"/>
      <line x1="2" y1="44" x2="85" y2="44"/>
    </g>
    <!-- flap -->
    <rect x="0.6" y="0.6" width="85.8" height="8.4" rx="1.2" fill="url(#flap)"/>
    <line x1="3.5" y1="8.7" x2="83.5" y2="8.7" stroke="#000" stroke-opacity="0.55" stroke-width="0.6"/>
    <path d="M43.5 2.6 L43.5 6.4 M41.8 4.2 L43.5 2.6 L45.2 4.2" fill="none" stroke="#FFF" stroke-opacity="0.28" stroke-width="0.7" stroke-linecap="round"/>
    <!-- windows -->
    <rect x="5.2" y="13.4" width="22.6" height="24.8" rx="1.4" fill="#08080A" stroke="#000" stroke-opacity="0.75" stroke-width="0.6"/>
    <rect x="59.2" y="13.4" width="22.6" height="24.8" rx="1.4" fill="#08080A" stroke="#000" stroke-opacity="0.75" stroke-width="0.6"/>
    <!-- label -->
    <rect x="29.6" y="15.3" width="27.8" height="21" rx="1.4" fill="url(#label)" stroke="#2A2A28" stroke-opacity="0.35" stroke-width="0.5"/>
    <text x="43.5" y="28.2" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="5.2" font-weight="900" letter-spacing="1.2" fill="#2A1810" fill-opacity="0.55">VHS</text>
    <!-- left reel (full) -->
    <g transform="translate(16.5,25.8)">
      <circle r="9.1" fill="#12100E"/>
      <circle r="8.0" fill="url(#tape)"/>
      <circle r="3.1" fill="#ECE8E0" stroke="#2A1810" stroke-opacity="0.45" stroke-width="0.4"/>
      <g stroke="#3A3028" stroke-opacity="0.7" stroke-width="0.55" stroke-linecap="round">
        <line x1="0.7" y1="-0.7" x2="2.2" y2="-2.3"/>
        <line x1="1.0" y1="0.3" x2="2.7" y2="0.7"/>
        <line x1="0.3" y1="1.0" x2="0.7" y2="2.7"/>
        <line x1="-0.7" y1="0.7" x2="-2.3" y2="2.2"/>
        <line x1="-1.0" y1="-0.3" x2="-2.7" y2="-0.7"/>
        <line x1="-0.3" y1="-1.0" x2="-0.7" y2="-2.7"/>
      </g>
      <circle r="0.85" fill="#2A2824"/>
      <circle r="0.35" fill="#0C0C0E"/>
    </g>
    <!-- right reel (emptier) -->
    <g transform="translate(70.5,25.8)">
      <circle r="8.6" fill="#12100E"/>
      <circle r="4.6" fill="url(#tape)"/>
      <circle r="2.9" fill="#ECE8E0" stroke="#2A1810" stroke-opacity="0.45" stroke-width="0.4"/>
      <g stroke="#3A3028" stroke-opacity="0.7" stroke-width="0.55" stroke-linecap="round">
        <line x1="-0.6" y1="-0.8" x2="-1.9" y2="-2.4"/>
        <line x1="0.4" y1="-0.9" x2="1.2" y2="-2.6"/>
        <line x1="0.95" y1="0.1" x2="2.55" y2="0.35"/>
        <line x1="0.5" y1="0.9" x2="1.35" y2="2.5"/>
        <line x1="-0.5" y1="0.9" x2="-1.4" y2="2.45"/>
        <line x1="-0.95" y1="0.05" x2="-2.55" y2="-0.2"/>
      </g>
      <circle r="0.8" fill="#2A2824"/>
      <circle r="0.32" fill="#0C0C0E"/>
    </g>
  </g>
</svg>
